apiVersion: v2
name: keycloak-config-kog
description: >-
  Krateo Operator Generator (KOG) packaging that exposes Keycloak Admin API
  resources (realm, client, protocol-mapper, client-scope, group,
  identity-provider) as native Kubernetes custom resources. oasgen-provider +
  rest-dynamic-controller reconcile each CR against a running Keycloak's Admin
  REST API. The bearer admin token is delivered/rotated into a Secret by the
  External Secrets Operator.
type: application
version: CHART_VERSION
appVersion: "26.0"
home: https://www.keycloak.org/
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - security
  - keycloak
  - identity
  - kog
annotations:
  krateo.io/category: security
  krateo.io/display-name: Keycloak Config KOG
  krateo.io/maturity: beta
  krateoSupportedVersion: ">= 2.5.1"
  # The oasgen-provider this chart needs: 0.67.0. 0.66.0 carries x-kubernetes-list-type/-map-keys into the
  # CRD and matches KeycloakClient.protocolMappers by mapper name (Keycloak returns them in its own order),
  # but on 0.66.0 a KeycloakUserProfile (no create verb) whose realm does not exist yet at its first
  # observe re-queues without backoff and never turns Ready (oasgen-provider #674, fixed in 0.67.0).
  # 0.62.0 already compares the realm's set-typed arrays (enabledEventTypes, eventsListeners) as sets.
  # 0.77.0: the update verbs of seven kinds declare `partialFields` (oasgen-provider #737, since 0.76.0), so
  # Keycloak's server-side keys in those maps are merged instead of deleted by the PUT. An older controller
  # ignores the field and an older RestDefinition CRD PRUNES it at admission, silently, so both floors are
  # required: the CRD floor names the installer COMPONENT (oasgen-provider-crd), not the chart. Not 0.76.0:
  # from 0.76.0 a lost create response on a kind with an observeApiRef (KeycloakServiceAccountRoleMapping,
  # KeycloakAuthenticationExecution) stuck at CreateOutcomeUnknown for good; 0.77.0 (unstructured-runtime
  # v1.24.0) requeues it instead, so these kinds recover by themselves and need no manual step.
  # 0.78.0 (next release): 0.77.0 is RETRACTED by oasgen-provider (its retracted-versions.yaml): on a
  # findby-addressed kind (most of this chart's) a create whose outcome cannot be determined stays
  # Creating instead of reaching CreateOutcomeUnknown, so a parent reads healthy over a resource that will
  # never exist. Fixed by #759 in 0.78.0. Measured here on 0.78.0 and 0.80.0 (kc-roll057, 2026-11-17).
  krateo.io/requires-oasgen-provider: ">= 0.78.0"
  krateo.io/requires-oasgen-provider-crd: ">= 0.78.0"
# Helm's `sources` is the source code of THIS chart, and release tooling resolves the chart version
# as a tag in each listed repo. The Keycloak OpenAPI document (an input, vendored under assets/) and
# oasgen-provider (the generator that reads it) are not this chart's source: listing oasgen-provider
# made installer's pin-ci resolve "0.5.1" to an unrelated ancient oasgen-provider tag.
sources:
  - https://github.com/krateo-blueprints/krateo-keycloak-operator-kog
maintainers:
  - name: krateo
