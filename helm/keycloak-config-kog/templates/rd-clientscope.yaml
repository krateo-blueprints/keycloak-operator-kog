{{- $kogRD := include "keycloak-config-kog.restDefinitions" . | fromYaml }}
{{- if $kogRD.clientscope.enabled }}
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: {{ .Release.Name }}-clientscope
  labels:
    {{- include "keycloak-config-kog.labels" . | nindent 4 }}
spec:
  oasPath: configmap://{{ .Release.Namespace }}/{{ .Release.Name }}-clientscope/clientscope.yaml
  resourceGroup: {{ .Values.resourceGroup }}
  resource:
    kind: {{ $kogRD.clientscope.kind }}
    # `name` natural key; server-generated UUID {id} resolved via findby and
    # excluded from spec. {realm} parent path param auto-surfaces as a spec field.
    identifiers:
      - name
    additionalStatusFields:
      - id
    # `id` is NOT excluded from spec (since 0.14.0): it is an OPTIONAL spec field, sent on create, so a chart can give a
    # scope a deterministic id and address its mappers (KeycloakClientScopeProtocolMapper {clientScopeId}) up front.
    # Keycloak honours a caller-chosen client-scope id (measured on 26.6.3). Measured on oasgen 0.80.0 that removing the
    # exclusion leaves spec.required unchanged (configurationRef, name, realm), so CRs without spec.id are unaffected.
    # get/update/delete still address the scope by status.id.
    verbsDescription:
      - action: findby
        method: GET
        path: /admin/realms/{realm}/client-scopes
      - action: create
        method: POST
        path: /admin/realms/{realm}/client-scopes
      - action: get
        method: GET
        path: /admin/realms/{realm}/client-scopes/{id}
        requestFieldMapping:
          - inPath: id
            inCustomResource: status.id
      - action: update
        method: PUT
        path: /admin/realms/{realm}/client-scopes/{id}
        # Keycloak fills this map with server-side keys the CR does not declare; the PUT would send it
        # whole and delete them. Merged with what Keycloak holds (oasgen-provider >= 0.76.0, #737).
        partialFields:
          - attributes
        requestFieldMapping:
          - inPath: id
            inCustomResource: status.id
      - action: delete
        method: DELETE
        path: /admin/realms/{realm}/client-scopes/{id}
        requestFieldMapping:
          - inPath: id
            inCustomResource: status.id
{{- end }}
