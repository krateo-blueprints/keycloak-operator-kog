openapi: 3.0.3
info:
  title: Keycloak Admin API - Client Scope Protocol Mappers (KOG subset)
  version: v1
  description: Hand-curated OpenAPI 3.0 subset of the Keycloak Admin REST API for the Protocol Mapper
    resource, sufficient to manage it through the Krateo Operator Generator (KOG). Declares the http/bearer
    security scheme that the upstream Keycloak OAS omits.
servers:
- url: '{{ .Values.keycloak.baseUrl }}'
  description: Keycloak base URL (no trailing slash).
security:
- bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Keycloak admin access token (OAuth2 Bearer).
  schemas:
    ProtocolMapperRepresentation:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Mapper name. Natural key (findby).
        protocol:
          type: string
          description: openid-connect or saml
        protocolMapper:
          type: string
          description: e.g. oidc-group-membership-mapper, oidc-usermodel-attribute-mapper
        consentRequired:
          type: boolean
        config:
          type: object
          additionalProperties:
            type: string
        id:
          type: string
          description: Server-generated identifier (read-only).
          readOnly: true
paths:
  /admin/realms/{realm}/client-scopes/{clientScopeId}/protocol-mappers/models:
    post:
      operationId: createClientscopeprotocolmapper
      summary: Create Protocol Mapper
      tags:
      - clientscopeprotocolmapper
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      - name: clientScopeId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolMapperRepresentation'
      responses:
        '201':
          description: Created. Identifier returned via Location header.
    get:
      operationId: listClientscopeprotocolmapper
      summary: List/find Protocol Mapper
      tags:
      - clientscopeprotocolmapper
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      - name: clientScopeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProtocolMapperRepresentation'
  /admin/realms/{realm}/client-scopes/{clientScopeId}/protocol-mappers/models/{id}:
    get:
      operationId: getClientscopeprotocolmapper
      summary: Get Protocol Mapper
      tags:
      - clientscopeprotocolmapper
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      - name: clientScopeId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolMapperRepresentation'
    put:
      operationId: updateClientscopeprotocolmapper
      summary: Update Protocol Mapper
      tags:
      - clientscopeprotocolmapper
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      - name: clientScopeId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolMapperRepresentation'
      responses:
        '204':
          description: Updated.
    delete:
      operationId: deleteClientscopeprotocolmapper
      summary: Delete Protocol Mapper
      tags:
      - clientscopeprotocolmapper
      parameters:
      - name: realm
        in: path
        required: true
        schema:
          type: string
      - name: clientScopeId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted.
